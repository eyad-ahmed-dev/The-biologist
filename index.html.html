<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Helix Biology Prep — EST2 · ACT2 · AP Biology</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,500&family=Inter:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.4/chart.umd.min.js"></script>
<style>
/* ============ TOKENS ============ */
:root{
  --navy:#0B1F3A;
  --navy-2:#132C52;
  --navy-3:#1B3A6B;
  --green:#3FA772;
  --green-l:#E4F5EC;
  --green-d:#2A7C54;
  --blue:#3E7CB1;
  --blue-l:#EAF3FA;
  --bg:#FAFAF7;
  --bg-2:#F2F2ED;
  --card:#FFFFFF;
  --ink:#0F1826;
  --muted:#606A78;
  --muted-2:#88919C;
  --border:#E6E8EC;
  --radius-lg:22px;
  --radius-md:16px;
  --radius-sm:10px;
  --shadow-sm:0 2px 10px rgba(11,31,58,.06);
  --shadow-md:0 10px 34px rgba(11,31,58,.10);
  --shadow-lg:0 22px 60px rgba(11,31,58,.14);
  --font-d:'Fraunces',serif;
  --font-b:'Inter',sans-serif;
  --font-m:'IBM Plex Mono',monospace;
}
*{box-sizing:border-box;}
html{scroll-behavior:smooth;}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-b);-webkit-font-smoothing:antialiased;}
h1,h2,h3,h4{font-family:var(--font-d);margin:0;color:var(--navy);letter-spacing:-.01em;}
p{margin:0;color:var(--muted);line-height:1.6;}
a{color:inherit;}
button{font-family:var(--font-b);cursor:pointer;}
::selection{background:var(--green-l);color:var(--navy);}
@media (prefers-reduced-motion: reduce){ *{animation-duration:.001ms !important; animation-iteration-count:1 !important; transition-duration:.001ms !important;} }

.hidden{display:none !important;}
.mono{font-family:var(--font-m);}
.container{max-width:1180px;margin:0 auto;padding:0 28px;}

/* ============ BUTTONS ============ */
.btn{display:inline-flex;align-items:center;gap:8px;justify-content:center;padding:13px 24px;border-radius:100px;font-weight:600;font-size:14.5px;border:1px solid transparent;transition:transform .18s ease, box-shadow .18s ease, background .18s ease;white-space:nowrap;}
.btn:active{transform:translateY(1px);}
.btn-primary{background:var(--navy);color:#fff;box-shadow:var(--shadow-sm);}
.btn-primary:hover{background:var(--navy-2);box-shadow:var(--shadow-md);transform:translateY(-1px);}
.btn-green{background:var(--green);color:#fff;}
.btn-green:hover{background:var(--green-d);transform:translateY(-1px);box-shadow:var(--shadow-md);}
.btn-outline{background:transparent;border-color:var(--navy);color:var(--navy);}
.btn-outline:hover{background:var(--navy);color:#fff;}
.btn-ghost{background:var(--bg-2);color:var(--navy);border-color:transparent;}
.btn-ghost:hover{background:var(--border);}
.btn-sm{padding:8px 16px;font-size:13px;border-radius:100px;}
.btn-block{width:100%;}
.btn[disabled]{opacity:.45;pointer-events:none;}

/* ============ TOPBAR (marketing) ============ */
.topbar{position:sticky;top:0;z-index:40;background:rgba(250,250,247,.86);backdrop-filter:blur(14px);border-bottom:1px solid var(--border);}
.topbar-inner{display:flex;align-items:center;justify-content:space-between;padding:16px 28px;max-width:1180px;margin:0 auto;}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--font-d);font-weight:600;font-size:20px;color:var(--navy);cursor:pointer;}
.brand-mark{width:32px;height:32px;flex:none;}
.topnav{display:flex;gap:28px;align-items:center;}
.topnav a{font-size:14.5px;font-weight:500;color:var(--navy-2);cursor:pointer;text-decoration:none;}
.topnav a:hover{color:var(--green-d);}
.topbar-cta{display:flex;gap:10px;}
.burger{display:none;background:none;border:none;padding:8px;}
@media (max-width:880px){ .topnav{display:none;} .burger{display:block;} }

/* ============ HERO ============ */
.hero{position:relative;overflow:hidden;padding:76px 0 60px;}
.hero-grid{display:grid;grid-template-columns:1.15fr .85fr;gap:40px;align-items:center;}
@media (max-width:960px){ .hero-grid{grid-template-columns:1fr;} }
.eyebrow{display:inline-flex;align-items:center;gap:8px;padding:6px 14px;border-radius:100px;background:var(--green-l);color:var(--green-d);font-size:12.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;margin-bottom:22px;}
.hero h1{font-size:clamp(38px,5.2vw,60px);line-height:1.04;font-weight:600;color:var(--navy);}
.hero h1 em{font-style:italic;color:var(--green-d);}
.hero p.lead{margin-top:20px;font-size:18px;max-width:520px;color:var(--muted);}
.hero-ctas{display:flex;gap:12px;margin-top:32px;flex-wrap:wrap;}
.hero-stats{display:flex;gap:0;margin-top:52px;border-top:1px solid var(--border);padding-top:26px;flex-wrap:wrap;}
.hero-stat{flex:1;min-width:130px;padding-right:20px;}
.hero-stat .num{font-family:var(--font-m);font-weight:600;font-size:22px;color:var(--navy);}
.hero-stat .lbl{font-size:12.5px;color:var(--muted-2);margin-top:4px;}

/* ---- DNA helix (signature element) ---- */
.dna-wrap{position:relative;height:460px;display:flex;align-items:center;justify-content:center;perspective:900px;}
.dna-rotator{position:relative;width:170px;height:400px;transform-style:preserve-3d;animation:spin 12s linear infinite;}
@keyframes spin{from{transform:rotateY(0)}to{transform:rotateY(360deg)}}
.rung{position:absolute;left:50%;top:50%;width:150px;height:0;}
.rung .bar{position:absolute;left:0;top:0;height:3px;width:100%;background:linear-gradient(90deg,var(--navy-3),var(--green));border-radius:3px;opacity:.85;}
.rung .dot{position:absolute;top:-5px;width:12px;height:12px;border-radius:50%;box-shadow:0 0 0 4px rgba(63,167,114,.12);}
.rung .dot.a{left:-6px;background:var(--navy-3);}
.rung .dot.b{right:-6px;background:var(--green);}
.orbit-particle{position:absolute;border-radius:50%;background:var(--blue);opacity:.35;animation:float 7s ease-in-out infinite;}
@keyframes float{0%,100%{transform:translateY(0) translateX(0);}50%{transform:translateY(-22px) translateX(10px);}}
.cell-blob{position:absolute;border-radius:50%;filter:blur(0);opacity:.5;}
.hero::before{content:'';position:absolute;top:-160px;right:-160px;width:480px;height:480px;border-radius:50%;background:radial-gradient(circle at 30% 30%,var(--blue-l),transparent 70%);pointer-events:none;}
.hero::after{content:'';position:absolute;bottom:-200px;left:-160px;width:420px;height:420px;border-radius:50%;background:radial-gradient(circle at 30% 30%,var(--green-l),transparent 70%);pointer-events:none;}

/* ============ SECTIONS ============ */
.section{padding:84px 0;}
.section-head{max-width:640px;margin:0 auto 46px;text-align:center;}
.section-head h2{font-size:clamp(28px,3.6vw,40px);font-weight:600;}
.section-head p{margin-top:14px;font-size:16.5px;}
.section-tight .section-head{margin-bottom:34px;}
.section-alt{background:var(--card);border-top:1px solid var(--border);border-bottom:1px solid var(--border);}

/* course cards */
.course-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:24px;}
@media (max-width:920px){ .course-grid{grid-template-columns:1fr;} }
.course-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius-lg);padding:30px;transition:transform .22s ease, box-shadow .22s ease;position:relative;overflow:hidden;}
.course-card:hover{transform:translateY(-5px);box-shadow:var(--shadow-lg);}
.course-card .icon{width:52px;height:52px;border-radius:14px;display:flex;align-items:center;justify-content:center;margin-bottom:18px;}
.course-card h3{font-size:22px;margin-bottom:8px;}
.course-card .tag{display:inline-block;font-size:11.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted-2);margin-bottom:14px;}
.course-card ul{margin:16px 0 22px;padding:0;list-style:none;}
.course-card li{display:flex;gap:10px;align-items:flex-start;font-size:14px;color:var(--muted);padding:5px 0;}
.course-card li svg{flex:none;margin-top:3px;}
.icon-est{background:var(--blue-l);color:var(--blue);}
.icon-act{background:var(--green-l);color:var(--green-d);}
.icon-ap{background:#EFE9FB;color:#6C4FBB;}

/* glass panel */
.glass{background:rgba(255,255,255,.6);backdrop-filter:blur(16px);border:1px solid rgba(255,255,255,.5);}

/* how it works / features */
.feat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:20px;}
@media (max-width:920px){ .feat-grid{grid-template-columns:repeat(2,1fr);} }
@media (max-width:560px){ .feat-grid{grid-template-columns:1fr;} }
.feat{padding:26px 22px;border-radius:var(--radius-md);background:var(--bg-2);}
.feat .n{font-family:var(--font-m);font-size:12px;color:var(--green-d);font-weight:600;}
.feat h4{margin-top:10px;font-size:17px;}
.feat p{margin-top:8px;font-size:13.8px;}

.cta-band{border-radius:28px;background:linear-gradient(135deg,var(--navy),var(--navy-3));padding:56px 48px;display:flex;justify-content:space-between;align-items:center;gap:24px;flex-wrap:wrap;position:relative;overflow:hidden;}
.cta-band h2{color:#fff;font-size:30px;max-width:460px;}
.cta-band p{color:#B8C6DC;margin-top:10px;}
.footer{padding:40px 0 60px;border-top:1px solid var(--border);}
.footer-inner{display:flex;justify-content:space-between;flex-wrap:wrap;gap:20px;font-size:13.5px;color:var(--muted-2);}

/* ============ AUTH ============ */
.auth-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:40px 20px;background:
  radial-gradient(circle at 15% 20%, var(--green-l), transparent 45%),
  radial-gradient(circle at 85% 80%, var(--blue-l), transparent 45%), var(--bg);}
.auth-card{width:100%;max-width:420px;background:var(--card);border:1px solid var(--border);border-radius:var(--radius-lg);padding:38px 34px;box-shadow:var(--shadow-lg);}
.auth-back{display:inline-flex;align-items:center;gap:6px;font-size:13.5px;color:var(--muted);margin-bottom:18px;cursor:pointer;}
.auth-tabs{display:flex;background:var(--bg-2);border-radius:100px;padding:4px;margin-bottom:24px;}
.auth-tab{flex:1;text-align:center;padding:9px;border-radius:100px;font-size:13.5px;font-weight:600;color:var(--muted);transition:.2s;}
.auth-tab.active{background:var(--navy);color:#fff;}
.field{margin-bottom:16px;}
.field label{display:block;font-size:12.5px;font-weight:600;color:var(--navy-2);margin-bottom:7px;}
.field input,.field select{width:100%;padding:12px 14px;border-radius:12px;border:1px solid var(--border);font-size:14.5px;background:var(--bg);font-family:var(--font-b);}
.field input:focus,.field select:focus{outline:2px solid var(--green);outline-offset:1px;border-color:var(--green);}
.auth-error{background:#FDEEEE;color:#B23B3B;font-size:13px;padding:10px 12px;border-radius:10px;margin-bottom:14px;}
.demo-list{margin-top:22px;border-top:1px dashed var(--border);padding-top:18px;}
.demo-list p.h{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--muted-2);margin-bottom:10px;}
.demo-row{display:flex;align-items:center;justify-content:space-between;padding:9px 12px;border-radius:10px;background:var(--bg-2);margin-bottom:7px;font-size:12.8px;cursor:pointer;transition:.15s;}
.demo-row:hover{background:var(--green-l);}
.demo-row .who{font-weight:600;color:var(--navy);}
.demo-row .meta{color:var(--muted-2);font-family:var(--font-m);font-size:11px;}

/* ============ APP SHELL ============ */
.app-shell{display:flex;min-height:100vh;}
.sidebar{width:246px;flex:none;background:var(--navy);color:#fff;display:flex;flex-direction:column;padding:22px 16px;position:sticky;top:0;height:100vh;}
.sidebar .brand{color:#fff;padding:0 8px;margin-bottom:26px;}
.side-user{display:flex;align-items:center;gap:10px;padding:10px;border-radius:14px;background:rgba(255,255,255,.06);margin-bottom:20px;}
.avatar{width:38px;height:38px;border-radius:50%;background:var(--green);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;flex:none;}

/* ---- animated 3D-style avatar creature ---- */
.avatar-creature{border-radius:50%;flex:none;overflow:visible;cursor:default;}
.avatar-creature .body{animation:avatarBob 2.4s ease-in-out infinite;transform-origin:center;}
.avatar-creature .eye{animation:avatarBlink 3.6s ease-in-out infinite;transform-origin:center;}
@keyframes avatarBob{0%,100%{transform:translateY(0) rotate(0deg);}50%{transform:translateY(-5px) rotate(-4deg);}}
@keyframes avatarBlink{0%,92%,100%{transform:scaleY(1);}96%{transform:scaleY(.15);}}
.avatar-pick{border-radius:16px;border:2px solid transparent;padding:10px;display:flex;align-items:center;justify-content:center;cursor:pointer;background:var(--bg-2);transition:.15s;}
.avatar-pick:hover{background:var(--green-l);}
.avatar-pick.selected{border-color:var(--green);background:var(--green-l);}
.avatar-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:16px;}

/* ---- session cards (teacher-uploaded lesson sessions) ---- */
.session-card{display:flex;align-items:center;gap:14px;padding:14px 16px;border:1px solid var(--border);border-radius:var(--radius-md);margin-bottom:10px;background:var(--card);}
.session-card .sicon{width:40px;height:40px;border-radius:12px;background:var(--blue-l);color:var(--blue);display:flex;align-items:center;justify-content:center;flex:none;}
.session-card .sinfo{flex:1;min-width:0;}
.session-card .sinfo h5{font-size:14px;color:var(--navy);font-weight:600;}
.session-card .sinfo span{font-size:11.5px;color:var(--muted-2);}
.upload-row{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;border:1px dashed var(--border);border-radius:12px;margin-top:10px;background:var(--bg-2);}
.stat-box{position:relative;}
.stat-box .sicon2{position:absolute;top:16px;right:16px;color:var(--green);opacity:.55;}
.side-user .name{font-size:13.5px;font-weight:600;}
.side-user .role{font-size:11px;color:#93A3BE;}
.side-nav{display:flex;flex-direction:column;gap:2px;flex:1;}
.side-link{display:flex;align-items:center;gap:11px;padding:11px 12px;border-radius:12px;color:#B8C6DC;font-size:14px;font-weight:500;transition:.15s;}
.side-link svg{flex:none;opacity:.85;}
.side-link:hover{background:rgba(255,255,255,.06);color:#fff;}
.side-link.active{background:var(--green);color:#fff;}
.side-foot{margin-top:auto;padding-top:14px;border-top:1px solid rgba(255,255,255,.1);}
.logout-link{display:flex;align-items:center;gap:10px;padding:11px 12px;border-radius:12px;color:#B8C6DC;font-size:13.5px;cursor:pointer;}
.logout-link:hover{color:#fff;}
.main{flex:1;min-width:0;padding:30px 36px 60px;}
.topline{display:flex;justify-content:space-between;align-items:center;margin-bottom:26px;flex-wrap:wrap;gap:14px;}
.topline h1{font-size:26px;}
.mobile-topbar{display:none;position:sticky;top:0;z-index:30;background:var(--navy);color:#fff;padding:14px 18px;align-items:center;justify-content:space-between;}
@media (max-width:900px){
  .sidebar{position:fixed;left:-260px;z-index:50;transition:left .25s ease;box-shadow:var(--shadow-lg);}
  .sidebar.open{left:0;}
  .mobile-topbar{display:flex;}
  .main{padding:20px 16px 50px;}
}
.sidebar-scrim{display:none;position:fixed;inset:0;background:rgba(11,31,58,.4);z-index:45;}
.sidebar-scrim.show{display:block;}

/* cards */
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius-lg);padding:24px;}
.grid-2{display:grid;grid-template-columns:1.3fr .7fr;gap:22px;}
@media (max-width:1000px){ .grid-2{grid-template-columns:1fr;} }
.grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;}
.grid-4{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;}
@media (max-width:900px){ .grid-3{grid-template-columns:1fr 1fr;} .grid-4{grid-template-columns:1fr 1fr;} }
@media (max-width:560px){ .grid-3{grid-template-columns:1fr;} .grid-4{grid-template-columns:1fr;} }

.stat-box{background:var(--card);border:1px solid var(--border);border-radius:var(--radius-md);padding:18px 20px;}
.stat-box .lbl{font-size:12px;color:var(--muted-2);font-weight:600;text-transform:uppercase;letter-spacing:.04em;}
.stat-box .val{font-family:var(--font-m);font-size:25px;font-weight:600;color:var(--navy);margin-top:6px;}
.stat-box .sub{font-size:12px;color:var(--green-d);margin-top:4px;}

/* progress ring */
.ring-wrap{position:relative;width:150px;height:150px;margin:0 auto;}
.ring-wrap svg{transform:rotate(-90deg);}
.ring-bg{fill:none;stroke:var(--bg-2);stroke-width:12;}
.ring-fg{fill:none;stroke:var(--green);stroke-width:12;stroke-linecap:round;transition:stroke-dashoffset 1s ease;}
.ring-label{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;}
.ring-label .pct{font-family:var(--font-m);font-size:26px;font-weight:600;color:var(--navy);}
.ring-label .txt{font-size:11px;color:var(--muted-2);}

/* progress bar */
.pbar{height:8px;border-radius:100px;background:var(--bg-2);overflow:hidden;}
.pbar > div{height:100%;background:linear-gradient(90deg,var(--blue),var(--green));border-radius:100px;transition:width .8s ease;}

/* course-mini card in dashboard */
.mini-course{border:1px solid var(--border);border-radius:var(--radius-md);padding:20px;background:var(--card);}
.mini-course .top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:10px;}
.mini-course h4{font-size:16.5px;}
.mini-course .stats-row{display:flex;gap:16px;margin:14px 0;flex-wrap:wrap;}
.mini-course .stats-row div{font-size:12px;color:var(--muted);}
.mini-course .stats-row b{display:block;font-family:var(--font-m);color:var(--navy);font-size:15px;}
.pill{display:inline-block;padding:4px 11px;border-radius:100px;font-size:11px;font-weight:700;letter-spacing:.02em;}
.pill-blue{background:var(--blue-l);color:var(--blue);}
.pill-green{background:var(--green-l);color:var(--green-d);}
.pill-purple{background:#EFE9FB;color:#6C4FBB;}
.pill-amber{background:#FDF3E3;color:#B0770C;}
.pill-red{background:#FDEEEE;color:#B23B3B;}

/* lesson list */
.lesson-row{display:flex;align-items:center;gap:14px;padding:15px 16px;border:1px solid var(--border);border-radius:var(--radius-md);margin-bottom:10px;background:var(--card);transition:.15s;}
.lesson-row:hover{border-color:var(--green);}
.lesson-row .chk{width:26px;height:26px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;font-size:13px;}
.chk.done{background:var(--green);color:#fff;}
.chk.todo{background:var(--bg-2);color:var(--muted-2);border:1px solid var(--border);}
.lesson-row .info{flex:1;min-width:0;}
.lesson-row .info h5{font-size:14.5px;color:var(--navy);font-weight:600;}
.lesson-row .info span{font-size:12px;color:var(--muted-2);}

/* topic performance bars */
.topic-row{display:flex;align-items:center;gap:14px;padding:10px 0;border-bottom:1px solid var(--border);}
.topic-row:last-child{border-bottom:none;}
.topic-row .tname{flex:0 0 220px;font-size:13.5px;font-weight:500;color:var(--navy-2);}
.topic-row .tbar{flex:1;}
@media (max-width:640px){ .topic-row{flex-wrap:wrap;} .topic-row .tname{flex:1 1 100%;} }

/* question card */
.q-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius-lg);padding:26px;}
.q-meta{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap;}
.q-text{font-size:17px;color:var(--navy);font-weight:500;line-height:1.5;margin-bottom:20px;}
.choice{display:flex;align-items:center;gap:12px;padding:13px 16px;border:1.5px solid var(--border);border-radius:14px;margin-bottom:10px;cursor:pointer;transition:.15s;font-size:14.5px;}
.choice:hover{border-color:var(--blue);background:var(--blue-l);}
.choice .letter{width:26px;height:26px;border-radius:50%;background:var(--bg-2);display:flex;align-items:center;justify-content:center;font-size:12.5px;font-weight:700;flex:none;}
.choice.selected{border-color:var(--navy);background:var(--bg-2);}
.choice.correct{border-color:var(--green);background:var(--green-l);}
.choice.incorrect{border-color:#D66;background:#FDEEEE;}
.choice.disabled{pointer-events:none;}
.explain-box{margin-top:16px;padding:16px;border-radius:14px;background:var(--bg-2);font-size:13.8px;color:var(--navy-2);}

/* exam nav grid */
.exam-nav-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;}
.exam-nav-btn{aspect-ratio:1;border-radius:10px;border:1px solid var(--border);background:var(--card);font-family:var(--font-m);font-size:12.5px;font-weight:600;color:var(--muted);display:flex;align-items:center;justify-content:center;position:relative;}
.exam-nav-btn.current{border-color:var(--navy);background:var(--navy);color:#fff;}
.exam-nav-btn.answered{background:var(--green-l);color:var(--green-d);border-color:var(--green);}
.exam-nav-btn.flagged::after{content:'';position:absolute;top:3px;right:3px;width:6px;height:6px;border-radius:50%;background:#E0A800;}

.timer-pill{font-family:var(--font-m);background:var(--navy);color:#fff;padding:9px 18px;border-radius:100px;font-weight:600;font-size:14.5px;display:flex;align-items:center;gap:8px;}

/* table */
table.data-table{width:100%;border-collapse:collapse;font-size:13.8px;}
table.data-table th{text-align:left;padding:12px 14px;color:var(--muted-2);font-size:11.5px;text-transform:uppercase;letter-spacing:.04em;border-bottom:1px solid var(--border);}
table.data-table td{padding:14px;border-bottom:1px solid var(--border);color:var(--navy-2);}
table.data-table tr:hover td{background:var(--bg-2);}
table.data-table tr{cursor:pointer;}

.badge-status{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;}
.dot{width:7px;height:7px;border-radius:50%;}
.dot-green{background:var(--green);}
.dot-amber{background:#E0A800;}
.dot-red{background:#D66;}

/* achievements */
.ach-card{border-radius:var(--radius-md);padding:20px;text-align:center;border:1px solid var(--border);background:var(--card);}
.ach-card .emoji{font-size:34px;}
.ach-card h5{font-size:14px;margin-top:10px;color:var(--navy);}
.ach-card p{font-size:12px;margin-top:4px;}
.ach-card.locked{opacity:.4;filter:grayscale(1);}

/* study plan */
.task-row{display:flex;align-items:center;gap:12px;padding:13px 14px;border:1px solid var(--border);border-radius:12px;margin-bottom:8px;background:var(--card);}
.task-row.done{opacity:.55;}
.task-row .tdone{width:22px;height:22px;border-radius:7px;border:2px solid var(--border);flex:none;display:flex;align-items:center;justify-content:center;font-size:12px;}
.task-row .tdone.checked{background:var(--green);border-color:var(--green);color:#fff;}
.task-row .tinfo{flex:1;}
.task-row .tinfo .t{font-size:14px;font-weight:500;color:var(--navy);}
.task-row .tinfo .t.strike{text-decoration:line-through;color:var(--muted-2);}
.task-row .tinfo .m{font-size:11.5px;color:var(--muted-2);}

.section-label{font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--muted-2);margin-bottom:14px;}

/* toast */
#toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--navy);color:#fff;padding:14px 22px;border-radius:100px;font-size:13.8px;font-weight:500;box-shadow:var(--shadow-lg);opacity:0;pointer-events:none;transition:.25s;z-index:100;display:flex;align-items:center;gap:10px;}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

/* chart card */
.chart-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius-lg);padding:22px;}
.chart-card h4{font-size:15px;margin-bottom:16px;}
canvas{max-width:100%;}

/* fade-in */
.fade-in{animation:fadeIn .35s ease;}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}

.frq-answer-box{width:100%;min-height:160px;border:1px solid var(--border);border-radius:14px;padding:14px;font-family:var(--font-b);font-size:14px;resize:vertical;}
.frq-answer-box:focus{outline:2px solid var(--green);border-color:var(--green);}

.modal-backdrop{position:fixed;inset:0;background:rgba(11,31,58,.45);z-index:80;display:flex;align-items:center;justify-content:center;padding:20px;}
.modal{background:#fff;border-radius:20px;padding:28px;max-width:440px;width:100%;box-shadow:var(--shadow-lg);}

.empty-state{text-align:center;padding:50px 20px;color:var(--muted-2);}
.empty-state svg{margin-bottom:14px;opacity:.5;}
</style>
</head>

<script>
/* =========================================================================
   DATA LAYER
========================================================================= */
const TOPICS = {
  ap:['Chemistry of Life','Cell Structure & Function','Cellular Energetics','Cell Communication & Cell Cycle','Heredity','Gene Expression & Regulation','Natural Selection & Evolution','Ecology'],
  est2:['Cell Biology','Genetics','Human Physiology','Ecology','Evolution','Molecular Biology'],
  act2:['Cell Biology','Genetics & Heredity','Human Body Systems','Ecology','Evolution','Biochemistry']
};

const COURSES = {
  ap:{ id:'ap', name:'AP Biology', short:'AP Bio', tagline:'College-level curriculum, MCQ + FRQ practice, AP-style scoring.',
    color:'purple', icon:'ap',
    features:['Full AP Biology curriculum','Unit-based lessons','MCQ practice','FRQ practice','Timed mock exams','AP-style scoring','Detailed explanations']},
  est2:{ id:'est2', name:'EST 2 Biology', short:'EST 2', tagline:'Complete topic-by-topic prep with practice questions and timed exams.',
    color:'blue', icon:'est',
    features:['Complete Biology curriculum','Topic-by-topic lessons','Practice questions','Timed exams','Score tracking','Weakness analysis']},
  act2:{ id:'act2', name:'ACT 2 Biology', short:'ACT 2', tagline:'Exam-style practice, full mock exams, and performance analytics.',
    color:'green', icon:'act',
    features:['Biology fundamentals','Exam-style questions','Timed practice','Full mock exams','Performance analytics']}
};

const LESSONS = [
  {id:'ap-l1',course:'ap',topic:'Chemistry of Life',title:'The Building Blocks of Life',
   objectives:['Identify the four major macromolecules and their monomers','Explain why water\'s polarity is essential for life','Describe how enzymes lower activation energy'],
   content:'All living things are built from four classes of macromolecules: carbohydrates, lipids, proteins, and nucleic acids. Each is assembled from smaller repeating units — monomers — linked through dehydration synthesis and broken apart through hydrolysis. Water\'s polarity allows it to form hydrogen bonds, giving it properties (cohesion, high specific heat, and its role as a universal solvent) that make cellular chemistry possible. Enzymes are globular proteins whose three-dimensional shape creates an active site that binds specific substrates, lowering the activation energy required for a reaction and dramatically speeding up metabolism.',
   keyTerms:[{t:'Monomer',d:'A small molecular unit that links with others to form a polymer.'},{t:'Dehydration synthesis',d:'A reaction that joins monomers by removing a water molecule.'},{t:'Active site',d:'The region of an enzyme where the substrate binds.'},{t:'Denaturation',d:'Loss of a protein\'s shape due to heat or pH change.'}],
   review:['Carbohydrates store/provide energy; lipids store long-term energy & form membranes','Proteins are built from amino acids and do most cellular work','Enzyme activity is sensitive to temperature and pH'],
   qids:['apq1','apq2']},
  {id:'ap-l2',course:'ap',topic:'Cell Structure & Function',title:'Inside the Cell: Structure Meets Function',
   objectives:['Compare prokaryotic and eukaryotic cell structure','Connect organelle structure to its function','Explain the role of the plasma membrane in selective permeability'],
   content:'Eukaryotic cells compartmentalize their functions into membrane-bound organelles. The mitochondria generate ATP through aerobic respiration, the rough ER and ribosomes synthesize proteins, the Golgi apparatus modifies and packages them, and lysosomes break down waste. The plasma membrane, a phospholipid bilayer studded with proteins, controls what enters and exits the cell — a property known as selective permeability — and is described by the fluid mosaic model.',
   keyTerms:[{t:'Fluid mosaic model',d:'Describes the membrane as a fluid bilayer with embedded proteins.'},{t:'Selective permeability',d:'The membrane\'s ability to allow some substances through more easily than others.'},{t:'Organelle',d:'A specialized membrane-bound structure within a eukaryotic cell.'},{t:'Cristae',d:'Folds of the inner mitochondrial membrane that increase surface area.'}],
   review:['Mitochondria = ATP production','Plasma membrane = selective permeability, fluid mosaic model','Rough ER + ribosomes = protein synthesis'],
   qids:['apq3','apq4']},
  {id:'ap-l3',course:'ap',topic:'Cellular Energetics',title:'Photosynthesis & Cellular Respiration',
   objectives:['Trace the flow of energy through the light and dark reactions','Outline the stages of aerobic cellular respiration','Explain why these two processes are complementary'],
   content:'Photosynthesis converts light energy into chemical energy stored in glucose. In the light-dependent reactions, chlorophyll absorbs light and splits water molecules, releasing oxygen and generating ATP and NADPH, which power the Calvin cycle to fix carbon dioxide into sugar. Cellular respiration reverses this energy flow: glycolysis, the Krebs cycle, and the electron transport chain break down glucose in the presence of oxygen, ultimately producing ATP, with the electron transport chain located in the inner mitochondrial membrane.',
   keyTerms:[{t:'Calvin cycle',d:'The set of light-independent reactions that fix CO2 into sugar.'},{t:'Glycolysis',d:'The splitting of glucose into pyruvate in the cytoplasm.'},{t:'Electron transport chain',d:'A series of membrane proteins that generate a proton gradient to produce ATP.'},{t:'Chemiosmosis',d:'ATP synthesis driven by a proton gradient across a membrane.'}],
   review:['Photosynthesis: light reactions (thylakoid) → Calvin cycle (stroma)','Respiration: glycolysis → Krebs cycle → electron transport chain','ETC occurs on the inner mitochondrial membrane'],
   qids:['apq5','apq6']},
  {id:'ap-l4',course:'ap',topic:'Heredity',title:'Mendelian Genetics & Inheritance Patterns',
   objectives:['Apply the law of segregation to monohybrid crosses','Distinguish genotype from phenotype','Use a Punnett square to predict offspring ratios'],
   content:'Gregor Mendel\'s experiments with pea plants revealed that traits are inherited as discrete units — alleles — rather than blending together. Each organism carries two alleles per gene, one from each parent, and the law of segregation states that these alleles separate during gamete formation. When one allele is dominant, it masks the effect of a recessive allele in a heterozygote. Punnett squares let us predict the probability of offspring genotypes and phenotypes from a given cross.',
   keyTerms:[{t:'Genotype',d:'The genetic makeup of an organism at a given gene.'},{t:'Phenotype',d:'The observable physical expression of a genotype.'},{t:'Homozygous',d:'Having two identical alleles for a gene.'},{t:'Law of segregation',d:'Allele pairs separate during gamete formation.'}],
   review:['Aa x Aa → 1:2:1 genotype ratio, 3:1 phenotype ratio','Genotype = genetic code; phenotype = observable trait','Punnett squares predict probability, not certainty'],
   qids:['apq7','apq8']},

  {id:'est2-l1',course:'est2',topic:'Cell Biology',title:'Cell Theory and Cell Types',
   objectives:['State the three principles of cell theory','Differentiate prokaryotic from eukaryotic cells','Identify plant-specific organelles'],
   content:'Cell theory establishes that all living things are composed of cells, the cell is the basic unit of life, and all cells arise from pre-existing cells. Prokaryotic cells (bacteria and archaea) lack a membrane-bound nucleus and complex organelles, while eukaryotic cells compartmentalize their DNA within a nucleus. Plant cells additionally contain a rigid cell wall, chloroplasts for photosynthesis, and a large central vacuole for storage and turgor pressure.',
   keyTerms:[{t:'Prokaryote',d:'A cell without a membrane-bound nucleus.'},{t:'Eukaryote',d:'A cell with a membrane-bound nucleus and organelles.'},{t:'Cell wall',d:'A rigid outer layer found in plant, fungal, and bacterial cells.'},{t:'Vacuole',d:'A storage organelle that helps maintain turgor pressure in plant cells.'}],
   review:['All cells come from pre-existing cells','Prokaryotes: no nucleus; Eukaryotes: membrane-bound nucleus','Plant-only structures: cell wall, chloroplast, large central vacuole'],
   qids:['esq1','esq2']},
  {id:'est2-l2',course:'est2',topic:'Genetics',title:'DNA, Genes, and Heredity Basics',
   objectives:['Describe the structure of DNA','Define gene, allele, and trait','Explain dominant vs. recessive inheritance'],
   content:'DNA is a double-stranded molecule made of nucleotides, each containing a sugar, phosphate, and nitrogenous base (A, T, C, or G), held together by complementary base pairing. A gene is a segment of DNA that codes for a trait, and different versions of a gene are called alleles. When an organism carries two different alleles, the dominant allele\'s trait is typically expressed while the recessive allele is masked.',
   keyTerms:[{t:'Nucleotide',d:'The basic building block of DNA: sugar + phosphate + base.'},{t:'Base pairing',d:'A pairs with T, C pairs with G.'},{t:'Gene',d:'A DNA segment that codes for a specific trait.'},{t:'Dominant allele',d:'An allele whose trait is expressed even in a heterozygote.'}],
   review:['DNA is a double helix held by A-T and C-G base pairing','Gene = DNA instructions; allele = a version of that gene','Dominant alleles mask recessive alleles in heterozygotes'],
   qids:['esq3','esq4']},
  {id:'est2-l3',course:'est2',topic:'Human Physiology',title:'Human Body Systems Overview',
   objectives:['Identify the major organ systems and their primary roles','Explain how the respiratory and circulatory systems interact','Describe the endocrine system\'s method of communication'],
   content:'The human body relies on interconnected organ systems: the respiratory system exchanges oxygen and carbon dioxide, the circulatory system transports these gases and nutrients via blood, and the nervous and endocrine systems coordinate the body\'s responses — the nervous system using fast electrical signals, the endocrine system using slower hormonal signals released into the bloodstream.',
   keyTerms:[{t:'Alveoli',d:'Tiny air sacs in the lungs where gas exchange occurs.'},{t:'Red blood cell',d:'The cell type responsible for transporting oxygen.'},{t:'Hormone',d:'A chemical messenger released by an endocrine gland.'},{t:'Homeostasis',d:'The maintenance of a stable internal environment.'}],
   review:['Respiratory + circulatory systems work together on gas exchange','Nervous system = fast, electrical; endocrine system = slower, hormonal','Homeostasis is maintained by coordinated organ systems'],
   qids:['esq5','esq6']},
  {id:'est2-l4',course:'est2',topic:'Ecology',title:'Ecosystems and Energy Flow',
   objectives:['Differentiate population, community, and ecosystem','Trace energy flow through trophic levels','Explain why energy flow is one-directional'],
   content:'A population is all individuals of one species in an area; a community includes all populations interacting in that area; an ecosystem includes the community plus the physical environment. Energy enters ecosystems through producers (via photosynthesis) and flows one-directionally through trophic levels to primary, secondary, and tertiary consumers, with energy lost as heat at each transfer — unlike matter, which cycles.',
   keyTerms:[{t:'Population',d:'All members of one species in a given area.'},{t:'Trophic level',d:'A feeding position in a food chain.'},{t:'Producer',d:'An organism that makes its own food, usually via photosynthesis.'},{t:'Energy pyramid',d:'A diagram showing energy loss at each trophic level.'}],
   review:['Population < community < ecosystem','Energy flows one-directionally; matter cycles','~90% of energy is lost as heat at each trophic transfer'],
   qids:['esq7','esq8']},

  {id:'act2-l1',course:'act2',topic:'Cell Biology',title:'Cell Structure Essentials',
   objectives:['Identify the function of major organelles','Explain osmosis and diffusion','Compare passive and active transport'],
   content:'Cells maintain internal order through organelles: the nucleus houses DNA, mitochondria generate ATP, and the plasma membrane regulates transport. Passive transport (diffusion, osmosis) moves substances down a concentration gradient without energy, while active transport moves substances against a gradient and requires ATP. Osmosis specifically refers to the movement of water across a selectively permeable membrane.',
   keyTerms:[{t:'Diffusion',d:'Movement of particles from high to low concentration.'},{t:'Osmosis',d:'Diffusion of water across a selectively permeable membrane.'},{t:'Active transport',d:'Movement of substances against a gradient, requiring ATP.'},{t:'Mitochondria',d:'The organelle responsible for producing ATP.'}],
   review:['Mitochondria = ATP; Nucleus = DNA storage','Osmosis = water movement across a membrane','Active transport requires energy; passive transport does not'],
   qids:['acq1','acq2']},
  {id:'act2-l2',course:'act2',topic:'Genetics & Heredity',title:'Patterns of Inheritance',
   objectives:['Distinguish genotype from phenotype','Predict outcomes of monohybrid and dihybrid crosses','Explain independent assortment'],
   content:'An organism\'s genotype is its genetic makeup, while phenotype is its observable expression. In a monohybrid cross (Aa x Aa), offspring show a 3:1 phenotypic ratio. In a dihybrid cross involving two independently assorting genes (AaBb x AaBb), the classic phenotypic ratio is 9:3:3:1, reflecting Mendel\'s law of independent assortment.',
   keyTerms:[{t:'Genotype',d:'An organism\'s genetic makeup.'},{t:'Phenotype',d:'An organism\'s observable trait.'},{t:'Dihybrid cross',d:'A cross tracking two genes at once.'},{t:'Independent assortment',d:'Genes for different traits sort into gametes independently.'}],
   review:['Monohybrid Aa x Aa → 3:1 phenotype ratio','Dihybrid AaBb x AaBb → 9:3:3:1 phenotype ratio','Independent assortment applies to genes on different chromosomes'],
   qids:['acq3','acq4']},
  {id:'act2-l3',course:'act2',topic:'Evolution',title:'Evolution and Natural Selection',
   objectives:['Define natural selection and its requirements','Distinguish homologous from analogous structures','Identify mechanisms of evolution besides selection'],
   content:'Natural selection occurs when heritable variation in a population leads to differences in survival and reproduction, gradually shifting the population\'s traits over generations. Homologous structures share a common evolutionary origin despite different functions (evidence for shared ancestry), while analogous structures serve similar functions but evolved independently. Genetic drift, mutation, and gene flow are additional mechanisms of evolutionary change alongside selection.',
   keyTerms:[{t:'Natural selection',d:'Differential survival and reproduction based on heritable traits.'},{t:'Homologous structure',d:'Structures with shared ancestry but different functions.'},{t:'Genetic drift',d:'Random change in allele frequency, pronounced in small populations.'},{t:'Fitness',d:'An organism\'s relative reproductive success.'}],
   review:['Natural selection requires heritable variation + differential reproduction','Homologous = shared ancestry; analogous = shared function only','Drift, mutation, gene flow, and selection all drive evolution'],
   qids:['acq5','acq6']},
  {id:'act2-l4',course:'act2',topic:'Biochemistry',title:'Biochemistry Basics: Macromolecules',
   objectives:['Identify the four macromolecule classes and their monomers','Explain the role of enzymes as biological catalysts','Describe the bonds that build proteins and nucleic acids'],
   content:'Carbohydrates, lipids, proteins, and nucleic acids are the four macromolecule classes essential to life. Proteins are built from amino acids linked by peptide bonds and folded into specific shapes that determine function, including as enzymes — biological catalysts that speed up reactions by lowering activation energy without being consumed.',
   keyTerms:[{t:'Peptide bond',d:'The covalent bond linking amino acids in a protein.'},{t:'Enzyme',d:'A protein that catalyzes biochemical reactions.'},{t:'Substrate',d:'The molecule an enzyme acts upon.'},{t:'Catalyst',d:'A substance that speeds up a reaction without being consumed.'}],
   review:['4 macromolecules: carbs, lipids, proteins, nucleic acids','Amino acids link via peptide bonds to form proteins','Enzymes lower activation energy and are reusable'],
   qids:['acq7','acq8']}
];

const QUESTIONS = [
  {id:'apq1',course:'ap',topic:'Chemistry of Life',difficulty:'Easy',text:'Which macromolecule serves as the primary long-term energy storage molecule in animals?',choices:['Carbohydrates','Lipids','Proteins','Nucleic acids'],correct:1,explain:'Lipids (fats) store roughly twice the energy per gram of carbohydrates and are the body\'s main long-term energy reserve.'},
  {id:'apq2',course:'ap',topic:'Chemistry of Life',difficulty:'Medium',text:'A change in pH away from an enzyme\'s optimum most directly affects which property?',choices:['Its primary structure covalent bonds','Its tertiary structure and active site shape','Its molecular weight','Its atomic composition'],correct:1,explain:'pH shifts disrupt the ionic and hydrogen bonds that maintain tertiary structure, distorting the active site.'},
  {id:'apq3',course:'ap',topic:'Cell Structure & Function',difficulty:'Easy',text:'Which organelle is responsible for producing ATP through aerobic respiration?',choices:['Golgi apparatus','Mitochondria','Ribosome','Lysosome'],correct:1,explain:'Mitochondria house the Krebs cycle and electron transport chain, generating the majority of a cell\'s ATP.'},
  {id:'apq4',course:'ap',topic:'Cell Structure & Function',difficulty:'Medium',text:'Which structure regulates what enters and exits the cell?',choices:['Cell wall','Nucleolus','Plasma membrane','Cytoskeleton'],correct:2,explain:'The plasma membrane\'s selective permeability controls the movement of substances into and out of the cell.'},
  {id:'apq5',course:'ap',topic:'Cellular Energetics',difficulty:'Medium',text:'During the light-dependent reactions of photosynthesis, which molecule is split to release electrons?',choices:['Carbon dioxide','Water','Glucose','ATP'],correct:1,explain:'Photolysis splits water, releasing electrons (to replace those lost by chlorophyll), protons, and oxygen gas.'},
  {id:'apq6',course:'ap',topic:'Cellular Energetics',difficulty:'Hard',text:'In cellular respiration, where does the electron transport chain occur in eukaryotic cells?',choices:['Cytoplasm','Inner mitochondrial membrane','Outer mitochondrial membrane','Nucleus'],correct:1,explain:'The ETC proteins are embedded in the inner mitochondrial membrane, where the proton gradient drives ATP synthase.'},
  {id:'apq7',course:'ap',topic:'Heredity',difficulty:'Easy',text:'In a monohybrid cross between two heterozygous (Aa) individuals, what fraction of offspring is expected to show the recessive phenotype?',choices:['1/4','1/2','3/4','0'],correct:0,explain:'Aa x Aa yields a 1:2:1 genotype ratio (AA:Aa:aa), so 1/4 of offspring are aa and show the recessive phenotype.'},
  {id:'apq8',course:'ap',topic:'Heredity',difficulty:'Medium',text:'Which term describes two different versions of a gene occupying the same locus?',choices:['Genotype','Alleles','Phenotype','Chromatid'],correct:1,explain:'Alleles are alternative versions of a gene found at the same location on homologous chromosomes.'},
  {id:'apq9',course:'ap',topic:'Gene Expression & Regulation',difficulty:'Hard',text:'Which process converts mRNA into a polypeptide chain?',choices:['Transcription','Replication','Translation','Splicing'],correct:2,explain:'Translation occurs at the ribosome, where mRNA codons are read to assemble amino acids into a polypeptide.'},
  {id:'apq10',course:'ap',topic:'Natural Selection & Evolution',difficulty:'Medium',text:'Which scenario best illustrates directional selection?',choices:['Extreme phenotypes are favored equally','The average phenotype is favored','One extreme phenotype is increasingly favored over time','No phenotype is favored'],correct:2,explain:'Directional selection shifts a population\'s trait distribution toward one extreme, such as increasing beak size.'},

  {id:'esq1',course:'est2',topic:'Cell Biology',difficulty:'Easy',text:'What structure is found in plant cells but not animal cells?',choices:['Nucleus','Cell wall','Mitochondria','Ribosome'],correct:1,explain:'The rigid cell wall, made of cellulose, provides structural support in plant cells and is absent in animal cells.'},
  {id:'esq2',course:'est2',topic:'Cell Biology',difficulty:'Medium',text:'Which type of cell lacks a membrane-bound nucleus?',choices:['Eukaryotic','Prokaryotic','Plant','Fungal'],correct:1,explain:'Prokaryotic cells (bacteria, archaea) keep their DNA in the cytoplasm rather than a membrane-bound nucleus.'},
  {id:'esq3',course:'est2',topic:'Genetics',difficulty:'Easy',text:'What is the genetic material found in most living organisms?',choices:['RNA','Protein','DNA','Lipid'],correct:2,explain:'DNA stores hereditary information in nearly all living organisms (some viruses use RNA instead).'},
  {id:'esq4',course:'est2',topic:'Genetics',difficulty:'Medium',text:'A dominant allele is best described as one that:',choices:['Is always more common in a population','Masks the recessive allele\'s effect when present','Only appears in homozygotes','Is inherited from the mother only'],correct:1,explain:'A dominant allele\'s phenotype is expressed even when paired with a recessive allele in a heterozygote.'},
  {id:'esq5',course:'est2',topic:'Human Physiology',difficulty:'Easy',text:'Which organ system is primarily responsible for gas exchange?',choices:['Digestive','Respiratory','Excretory','Nervous'],correct:1,explain:'The respiratory system exchanges oxygen and carbon dioxide between the air and the bloodstream.'},
  {id:'esq6',course:'est2',topic:'Human Physiology',difficulty:'Medium',text:'Which blood cell type is primarily responsible for oxygen transport?',choices:['White blood cells','Platelets','Red blood cells','Plasma cells'],correct:2,explain:'Red blood cells contain hemoglobin, which binds and transports oxygen throughout the body.'},
  {id:'esq7',course:'est2',topic:'Ecology',difficulty:'Easy',text:'What term describes all the organisms of one species living in an area?',choices:['Community','Population','Ecosystem','Biome'],correct:1,explain:'A population consists of all individuals of a single species inhabiting a defined area.'},
  {id:'esq8',course:'est2',topic:'Ecology',difficulty:'Medium',text:'Energy flow through an ecosystem is best described as:',choices:['Cyclical','One-directional, from producers to consumers','Reversible','Constant at every level'],correct:1,explain:'Unlike matter, energy flows one-directionally through an ecosystem and is progressively lost as heat.'},
  {id:'esq9',course:'est2',topic:'Evolution',difficulty:'Medium',text:'Structures with a common evolutionary origin but different functions are called:',choices:['Analogous','Homologous','Vestigial','Convergent'],correct:1,explain:'Homologous structures, like a bat wing and a human arm, share ancestry despite differing functions.'},
  {id:'esq10',course:'est2',topic:'Molecular Biology',difficulty:'Hard',text:'Which enzyme unwinds the DNA double helix during replication?',choices:['DNA polymerase','Helicase','Ligase','Primase'],correct:1,explain:'Helicase breaks the hydrogen bonds between base pairs, unwinding the double helix ahead of replication.'},

  {id:'acq1',course:'act2',topic:'Cell Biology',difficulty:'Easy',text:'The powerhouse of the cell is the:',choices:['Nucleus','Mitochondria','Ribosome','Vacuole'],correct:1,explain:'Mitochondria generate the majority of a cell\'s ATP through aerobic respiration.'},
  {id:'acq2',course:'act2',topic:'Cell Biology',difficulty:'Medium',text:'Osmosis refers to the movement of:',choices:['Solutes across a membrane','Water across a selectively permeable membrane','Proteins into the cell','Gases out of the cell'],correct:1,explain:'Osmosis is specifically the diffusion of water molecules across a selectively permeable membrane.'},
  {id:'acq3',course:'act2',topic:'Genetics & Heredity',difficulty:'Easy',text:'An organism\'s physical appearance is its:',choices:['Genotype','Phenotype','Karyotype','Allele'],correct:1,explain:'Phenotype refers to observable physical traits, resulting from genotype and environmental interaction.'},
  {id:'acq4',course:'act2',topic:'Genetics & Heredity',difficulty:'Medium',text:'A cross between AaBb x AaBb (independent assortment) produces which phenotype ratio in a dihybrid cross?',choices:['1:1','3:1','9:3:3:1','1:2:1'],correct:2,explain:'Two independently assorting genes produce the classic 9:3:3:1 phenotypic ratio in a dihybrid cross.'},
  {id:'acq5',course:'act2',topic:'Human Body Systems',difficulty:'Easy',text:'Which system coordinates the body\'s response using electrical signals?',choices:['Endocrine','Nervous','Circulatory','Skeletal'],correct:1,explain:'The nervous system uses fast electrical impulses along neurons to coordinate rapid responses.'},

const LS_KEY='helixbio_progress_v1';
function loadDelta(sid){ try{ const raw=localStorage.getItem(LS_KEY+'_'+sid); return raw?JSON.parse(raw):null; }catch(e){ return null; } }
function saveDelta(sid,delta){ try{ localStorage.setItem(LS_KEY+'_'+sid,JSON.stringify(delta)); }catch(e){} }

function hydrateStudent(seed){
  const d=loadDelta(seed.id)||{};
  const st=JSON.parse(JSON.stringify(seed));
  st.completedLessons = Array.from(new Set([...st.completedLessons, ...(d.completedLessons||[])]));
  st.attempts = [...(st.attempts||[]), ...(d.attempts||[])];
  st.examAttempts = [...st.examAttempts, ...(d.examAttempts||[])];
  st.frqSubmitted = Array.from(new Set([...st.frqSubmitted, ...(d.frqSubmitted||[])]));
  st.solved = st.solved + (d.extraSolved||0);
  if(d.taskDone) st.taskDone = d.taskDone;
  if(d.courseProgressBump){ for(const c in d.courseProgressBump){ st.courseProgress[c]=Math.min(100,(st.courseProgress[c]||0)+d.courseProgressBump[c]); } }
  if(typeof d.accuracy==='number') st.accuracy=d.accuracy;
  return st;
}
function persistAction(sid,mutator){
  const d=loadDelta(sid)||{completedLessons:[],attempts:[],examAttempts:[],frqSubmitted:[],extraSolved:0,taskDone:[],courseProgressBump:{}};
  mutator(d);
  saveDelta(sid,d);
}

function dnaHeroSvg(){
  let rungs='';
  for(let i=0;i<20;i++){
    const y=i*20-190; const angle=i*32;
    rungs+=`<div class="rung" style="transform:translateY(${y}px) rotateY(${angle}deg);"><div class="bar"></div><div class="dot a"></div><div class="dot b"></div></div>`;
  }
  let particles='';
  const pos=[[10,10,'8px','0s'],[85,20,'12px','1s'],[15,80,'10px','2s'],[80,75,'14px','.5s'],[45,5,'6px','1.5s']];
  pos.forEach(p=>{ particles+=`<div class="orbit-particle" style="left:${p[0]}%;top:${p[1]}%;width:${p[2]};height:${p[2]};animation-delay:${p[3]};"></div>`; });
  return `<div style="position:relative;width:100%;height:100%;">
    ${particles}
    <div class="cell-blob" style="width:120px;height:120px;left:0;top:20px;background:radial-gradient(circle at 35% 35%,var(--green-l),transparent 70%);"></div>
    <div class="cell-blob" style="width:160px;height:160px;right:-10px;bottom:0;background:radial-gradient(circle at 35% 35%,var(--blue-l),transparent 70%);"></div>
    <div class="dna-rotator" style="margin:0 auto;top:30px;">${rungs}</div>
  </div>`;
}

  e.preventDefault();

function unlockedAchievements(u){
  const totalAcc=u.accuracy;
  const list=[];
  if(u.completedLessons.length>0) list.push('first_lesson');
  if(u.streak>=7) list.push('streak_7');
  if(totalAcc>=90) list.push('accuracy_90');
  if(u.solved>=100) list.push('questions_100');
  u.enrolled.forEach(c=>{ if(lessonsForCourse(c).every(l=>u.completedLessons.includes(l.id))) list.push('biology_master'); });
  if(u.examAttempts.some(a=>a.score>=90)) list.push('mock_champion');
  return Array.from(new Set(list));
}

function lessonDiagram(l){
  // simple original schematic illustrations depending on topic keyword
  if(/Cell|Structure/i.test(l.topic)) return `<svg viewBox="0 0 200 160" width="100%"><ellipse cx="100" cy="80" rx="90" ry="65" fill="var(--green-l)" stroke="var(--green)" stroke-width="2"/><circle cx="90" cy="75" r="22" fill="var(--blue-l)" stroke="var(--blue)" stroke-width="2"/><ellipse cx="140" cy="60" rx="14" ry="8" fill="#fff" stroke="var(--navy-3)" stroke-width="1.5"/><ellipse cx="60" cy="110" rx="14" ry="8" fill="#fff" stroke="var(--navy-3)" stroke-width="1.5"/><ellipse cx="130" cy="115" rx="10" ry="10" fill="#fff" stroke="var(--navy-3)" stroke-width="1.5"/></svg>`;
  if(/Energetics|respiration|photosynthesis/i.test(l.topic+l.title)) return `<svg viewBox="0 0 200 160" width="100%"><rect x="20" y="60" width="160" height="46" rx="20" fill="var(--blue-l)" stroke="var(--blue)" stroke-width="2"/><path d="M40 83h30M110 83h30" stroke="var(--navy-3)" stroke-width="3" marker-end="url(#a)"/><circle cx="90" cy="83" r="16" fill="var(--green)" opacity=".85"/><defs><marker id="a" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="var(--navy-3)"/></marker></defs></svg>`;
  if(/Heredity|Genetics/i.test(l.topic)) return `<div class="mono" style="font-size:13px;"><table style="width:100%;border-collapse:collapse;text-align:center;"><tr><td></td><td style="padding:8px;background:var(--green-l);border-radius:8px;">A</td><td style="padding:8px;background:var(--green-l);border-radius:8px;">a</td></tr><tr><td style="padding:8px;background:var(--blue-l);border-radius:8px;">A</td><td style="padding:8px;">AA</td><td style="padding:8px;">Aa</td></tr><tr><td style="padding:8px;background:var(--blue-l);border-radius:8px;">a</td><td style="padding:8px;">Aa</td><td style="padding:8px;">aa</td></tr></table></div>`;
  return `<svg viewBox="0 0 200 160" width="100%">${(()=>{ let r=''; for(let i=0;i<6;i++){ r+=`<circle cx="${30+i*28}" cy="${80+ (i%2?20:-20)}" r="14" fill="${i%2?'var(--blue-l)':'var(--green-l)'}" stroke="${i%2?'var(--blue)':'var(--green)'}" stroke-width="2"/>`; } return r; })()}</svg>`;
}
function miniQuestionCard(q){
  return `<div class="q-card" style="margin-bottom:14px;" id="mini-${q.id}">
    <div class="q-meta"><span class="pill pill-blue">${q.topic}</span><span class="pill pill-amber">${q.difficulty}</span></div>
    <div class="q-text">${q.text}</div>
    <div id="choices-${q.id}">${q.choices.map((c,i)=>`<div class="choice" onclick="answerMini('${q.id}',${i})"><div class="letter">${String.fromCharCode(65+i)}</div>${c}</div>`).join('')}</div>
  </div>`;
}
function answerMini(qid,i){
  const q=QUESTIONS.find(x=>x.id===qid);
  const wrap=document.getElementById('choices-'+qid);
  [...wrap.children].forEach((el2,idx)=>{ el2.classList.add('disabled'); if(idx===q.correct) el2.classList.add('correct'); else if(idx===i) el2.classList.add('incorrect'); });
  wrap.insertAdjacentHTML('afterend',`<div class="explain-box"><b>${i===q.correct?'Correct! ':'Not quite. '}</b>${q.explain}</div>`);
  persistAction(state.user.id,d=>{ d.extraSolved=(d.extraSolved||0)+1; d.attempts.push({qid,correct:i===q.correct}); });
}

function studentPracticeSetup(){

    <button class="btn btn-green btn-block" onclick="startPractice()">Generate Practice Session</button>

function renderTopicOptions(){
  const c=document.getElementById('pCourse').value;
  const sel=document.getElementById('pTopic');
  sel.innerHTML='<option value="Any">Any Topic</option>'+TOPICS[c].map(t=>`<option>${t}</option>`).join('');
}
function startPractice(){
  const c=document.getElementById('pCourse').value;
  const topic=document.getElementById('pTopic').value;
  const diff=document.getElementById('pDiff').value;
  const count=parseInt(document.getElementById('pCount').value,10);
  let pool=QUESTIONS.filter(q=>q.course===c && (topic==='Any'||q.topic===topic) && (diff==='Any'||q.difficulty===diff));
  if(pool.length===0) pool=QUESTIONS.filter(q=>q.course===c);
  const qs=[]; for(let i=0;i<count;i++){ qs.push(pool[i%pool.length]); }
  state.practice={course:c,topic,diff,qs,idx:0,answers:[],startTime:Date.now()};
  go('practice-session');
}
function renderPracticeSession(main){
  const p=state.practice; if(!p) return main.innerHTML=studentPracticeSetup();
  const q=p.qs[p.idx];
  main.innerHTML=`<div class="topline"><div><h1>Practice Session</h1><p>${COURSES[p.course].name} · Question ${p.idx+1} of ${p.qs.length}</p></div>
    <button class="btn btn-ghost btn-sm" onclick="if(confirm('End this session early?')){finishPractice();}">End Session</button></div>
  <div class="pbar" style="margin-bottom:22px;"><div style="width:${(p.idx/p.qs.length)*100}%;"></div></div>
  <div class="q-card">
    <div class="q-meta"><span class="pill pill-blue">${q.topic}</span><span class="pill pill-amber">${q.difficulty}</span></div>
    <div class="q-text">${q.text}</div>
    <div id="pchoices">${q.choices.map((c,i)=>`<div class="choice" onclick="answerPractice(${i})"><div class="letter">${String.fromCharCode(65+i)}</div>${c}</div>`).join('')}</div>
    <div id="pexplain"></div>
    <div style="display:flex;justify-content:flex-end;margin-top:18px;"><button class="btn btn-primary" id="pnextbtn" style="display:none;" onclick="nextPractice()">${p.idx===p.qs.length-1?'See Results':'Next Question'} &rarr;</button></div>
  </div>`;
}
function answerPractice(i){
  const p=state.practice; const q=p.qs[p.idx];
  const wrap=document.getElementById('pchoices');
  [...wrap.children].forEach((el2,idx)=>{ el2.classList.add('disabled'); if(idx===q.correct) el2.classList.add('correct'); else if(idx===i) el2.classList.add('incorrect'); });
  document.getElementById('pexplain').innerHTML=`<div class="explain-box"><b>${i===q.correct?'Correct! ':'Not quite. '}</b>${q.explain}</div>`;
  document.getElementById('pnextbtn').style.display='inline-flex';
  p.answers.push({qid:q.id,correct:i===q.correct,topic:q.topic});
}
function nextPractice(){
  const p=state.practice;
  if(p.idx<p.qs.length-1){ p.idx++; renderStudentView(); }
  else finishPractice();
}
function finishPractice(){
  const p=state.practice; const u=state.user;
  const correct=p.answers.filter(a=>a.correct).length; const total=p.answers.length||1;
  persistAction(u.id,d=>{ d.extraSolved=(d.extraSolved||0)+p.answers.length; d.attempts.push(...p.answers); });
  state.practiceResult={score:Math.round((correct/total)*100),correct,total,seconds:Math.round((Date.now()-p.startTime)/1000),topicBreak:groupTopics(p.answers)};
  go('practice-results');
}
function groupTopics(answers){
  const m={}; answers.forEach(a=>{ if(!m[a.topic]) m[a.topic]={c:0,t:0}; m[a.topic].t++; if(a.correct) m[a.topic].c++; }); return m;
}

  </div>

function startExam(examId){
  const e=EXAMS[examId]; const qs=e.qids.map(id=>QUESTIONS.find(q=>q.id===id));

function startExamTimer(){
  clearInterval(window.__examTimer);
  window.__examTimer=setInterval(()=>{
    if(!state.exam || state.view!=='exam-session'){ clearInterval(window.__examTimer); return; }
    state.exam.secondsLeft--;
    const pill=document.getElementById('examTimerPill');
    if(pill) pill.innerHTML=icon('clock')+' '+fmtTime(state.exam.secondsLeft);
    if(state.exam.secondsLeft<=0){ clearInterval(window.__examTimer); submitExam(true); }
  },1000);
}

function submitExam(timedOut){
  clearInterval(window.__examTimer);
  const ex=state.exam; const u=state.user;

  const score=Math.round((correct/ex.qs.length)*100);
  const usedSeconds=Math.round((Date.now()-ex.startTime)/1000);
  persistAction(u.id,d=>{ d.examAttempts.push({examId:ex.examId,score,date:new Date().toISOString().slice(0,10)}); d.extraSolved=(d.extraSolved||0)+ex.qs.length; });
  state.examResult={examId:ex.examId,score,correct,total:ex.qs.length,timedOut,usedSeconds,topicBreak,answers:ex.answers,qs:ex.qs};
  go('exam-results');
}

function toggleModel(id){ document.getElementById('frqmodel-'+id).classList.toggle('hidden'); }
function submitFRQ(id){
  const f=FRQS.find(x=>x.id===id);
  const text=document.getElementById('frq-'+id).value.toLowerCase();
  let hits=0;
  const keywordSets=[/active site|substrate|specific/,/tertiary|shape|structure/,/temperature|heat|denature/,/ph/, /heritable|variation/,/predator|pressure|selective/,/survive|reproduc/,/allele frequenc|generation/, /diploid|identical/,/haploid|gamete/,/crossing over|independent assortment|variation/,/division/];
  keywordSets.forEach(rx=>{ if(rx.test(text)) hits++; });
  const scoreEst=Math.min(f.points, Math.max(0,Math.round((hits/3))));
  document.getElementById('frqfeedback-'+id).innerHTML=`<div class="explain-box" style="margin-top:12px;"><b>Estimated rubric coverage: ${scoreEst}/${f.points}</b><br>This is a rule-based estimate for demo purposes — compare your response against the rubric points below.<ul style="margin:10px 0 0;padding-left:18px;">${f.rubric.map(r=>'<li>'+r+'</li>').join('')}</ul></div>`;
  persistAction(state.user.id,d=>{ if(!d.frqSubmitted.includes(id)) d.frqSubmitted.push(id); });
  state.user.frqSubmitted = Array.from(new Set([...state.user.frqSubmitted,id]));
  toast('FRQ response submitted');
}

  if(c2){ new Chart(c2,{type:'bar',data:{labels:raw.map(s=>s.name),datasets:[{label:'Progress %',data:raw.map(s=>s.progress),backgroundColor:'#3E7CB1',borderRadius:6},{label:'Avg Score %',data:raw.map(s=>s.score),backgroundColor:'#3FA772',borderRadius:6}]},options:{animation:{duration:1300,easing:'easeOutQuart'},scales:{y:{min:0,max:100}}}}); }
}
